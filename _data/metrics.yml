# 지표 대시보드 데이터 — 단일 소스 (예시: metrics_status.md 실측값 기반)
# 구조: 심사 지표(metric) × 제품 카테고리(category) 셀 단위로 목표·이력을 기록.
# com.lifetutorial 쪽에서 이 파일을 관리하고 cron으로 복사하면 페이지가 자동 갱신된다.

categories:
  - { id: game,   name: 메인게임,   desc: "악덕 사장 NPC를 말로 설득하는 방어전 게임" }
  - { id: guard,  name: 실전 가드,  desc: "근로계약서를 찍으면 위험 조항을 찾아주는 기능" }
  - { id: report, name: 상담 리포트, desc: "인터뷰 내용을 정리해 상담 준비 자료로 만드는 기능" }
  - { id: system, name: 전체 구성,  desc: "서비스를 떠받치는 컴퓨터 자원과 개발 규모" }

metrics:
  - { id: accuracy,      name: 정확도,          eli5: "문제를 냈을 때 정답을 얼마나 맞히나" }
  - { id: hallucination, name: Hallucination,   eli5: "없는 사실을 그럴듯하게 지어내지 않나" }
  - { id: latency,       name: Latency,         eli5: "답이 나올 때까지 몇 초 걸리나" }
  - { id: recall_k,      name: "Recall@K",      eli5: "질문에 맞는 법 조문을 상위 몇 개 안에 찾아오나" }
  - { id: task_completion, name: Task completion, eli5: "가상 사용자가 처음부터 끝까지 막힘 없이 완주하나" }
  - { id: cost,          name: Cost,            eli5: "한 번 쓸 때 비용이 얼마나 드나" }
  - { id: retry,         name: Retry 횟수,      eli5: "한 단계를 넘는 데 평균 몇 번 다시 시도하나" }
  - { id: resource,      name: 자원·규모,       eli5: "우리 컴퓨터 메모리에 다 들어가나, 얼마나 많이 만들었나" }

# status: pass(게이트 충족) / progress(산출 진행) / todo(계측·계산 예정) / na(해당 없음 — 설계 결정)
